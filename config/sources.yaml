# Configuration-driven source registry.
# Application code should not hard-code universities or orgs.

http:
  timeout_sec: 25
  retries: 3
  per_host_delay_sec: 1.2
  cache_ttl_sec: 3600
  user_agent: "BostonEventRadar/0.1 (personal research; +https://github.com/sebmvp/boston-event-radar)"

discover:
  lookahead_days: 75
  luma_pages: 4
  luma_page_size: 50
  localist_per_page: 50
  hydrate_luma_details_for_top_n: 15

sources:
  - id: luma_boston_ai
    type: luma_discover
    enabled: true
    category: event_platform
    latitude: 42.3601
    longitude: -71.0589
    slugs: [ai]
    city_allowlist:
      - Boston
      - Cambridge
      - Somerville
      - Brookline
      - Medford
      - Allston
      - Brighton
      - Quincy
      - Newton
      - Watertown
      - Waltham
      - Arlington
      - Belmont
      - Charlestown
      - Dorchester
      - Roxbury
      - Jamaica Plain
      - Natick
    notes: "Luma public discover JSON used by luma.com"

  - id: luma_boston_crypto
    type: luma_discover
    enabled: true
    category: event_platform
    latitude: 42.3601
    longitude: -71.0589
    slugs: [crypto]
    city_allowlist:
      - Boston
      - Cambridge
      - Somerville
      - Brookline

  - id: luma_fintech_that_thinks
    type: luma_event
    enabled: true
    category: ecosystem
    slug: fintechthatthinks
    notes: "Flagship Boston Fintech Week forum on Luma"

  - id: html_boston_fintech_week
    type: html_page
    enabled: true
    category: ecosystem
    url: https://bostonfintechweek.com/
    title_hint: Boston Fintech Week
    organizer_hint: Fintech Sandbox
    city_hint: Boston

  - id: mit_localist
    type: localist
    enabled: true
    category: university
    org: MIT
    base_url: https://calendar.mit.edu
    days: 60
    filter_by_keywords: true

  - id: umass_amherst_localist
    type: localist
    enabled: true
    category: university
    org: UMass Amherst
    base_url: https://events.umass.edu
    days: 60
    filter_by_keywords: true
    far_campus: true

  - id: neu_localist
    type: localist
    enabled: true
    category: university
    org: Northeastern
    base_url: https://calendar.northeastern.edu
    days: 45
    filter_by_keywords: true

  - id: mit_ics
    type: ics
    enabled: true
    category: university
    org: MIT
    url: https://calendar.mit.edu/calendar.ics
    filter_by_keywords: true
    notes: "Public Localist ICS; filtered client-side"

