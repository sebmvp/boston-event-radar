[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boston-event-radar"
version = "0.1.0"
description = "Discover high-value Boston-area professional events early, and find cheap or free ways in."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Seb" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "icalendar>=6.0",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
event-radar = "event_radar.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["event_radar"]
